name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the [open issues](https://github.com/got-feedBack/feedBack/issues) first to see if someone already asked for it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and short description of the idea.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What are you trying to do, and what gets in the way today?
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: If the idea is for a plugin, name it. Leave empty if it is for the core app.
  - type: textarea
    id: mockup
    attributes:
      label: Mockup
      description: If it helps, add sketches, mockups or screenshots.
